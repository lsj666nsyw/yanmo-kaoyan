<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#98392a">
<title>离线 · 研墨</title>
<style>
  :root { --paper: #f7f5ef; --ink: #1c1b17; --muted: #777168; --accent: #98392a; --line: #d9d4c8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 22px; background: var(--paper); color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  }
  main { width: 100%; max-width: 420px; }
  .seal {
    width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px; background: var(--accent); color: var(--paper); font-size: 26px; line-height: 1;
  }
  h1 { margin: 0; font-size: 27px; font-weight: 400; line-height: 1.35; }
  p { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.9; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  button, a {
    min-height: 46px; display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 18px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); font: inherit; font-size: 13px; text-decoration: none; cursor: pointer;
  }
  button { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  a { background: #fff; }
</style>
</head>
<body>
<main>
  <div class="seal" aria-hidden="true">研</div>
  <h1>现在还没有离线缓存</h1>
  <p>研墨的离线副本还没有准备好。请联网后重新打开一次，页面会自动缓存；之后断网也能继续用。</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">重新加载</button>
    <a href="./">回到首页</a>
  </div>
</main>
</body>
</html>
