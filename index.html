<script>
(function () {
  // 先注册离线缓存，不依赖 app.js；网络抖动卡住脚本时也能拿到新版本。
  var buildMeta = document.querySelector('meta[name="app-build"]');
  var build = buildMeta ? buildMeta.content : "";
  if (build && "serviceWorker" in navigator) {
    var secure = location.protocol === "https:"
      || location.hostname === "localhost"
      || location.hostname === "127.0.0.1";
    window.__yanmoHadController = !!navigator.serviceWorker.controller;
    window.__yanmoUpdated = false;
    if (window.__yanmoHadController) {
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        window.__yanmoUpdated = true;
      });
    }
    if (secure) {
      navigator.serviceWorker.register("sw.js?v=" + encodeURIComponent(build)).catch(function () {});
    }
  }

  var timer = setTimeout(function () {
    var actions = document.getElementById("bootActions");
    if (actions) actions.hidden = false;
  }, 8000);
  window.addEventListener("error", function (event) {
    if (event.target && event.target.tagName === "SCRIPT") {
      clearTimeout(timer);
      var actions = document.getElementById("bootActions");
      if (actions) actions.hidden = false;
    }
  }, true);
})();
</script>
